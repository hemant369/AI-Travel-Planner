services:
  travel-planner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - ./app/.env
    environment:
      # Ollama runs on the host machine, outside this Compose project.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      # Makes the same hostname work with Docker Engine on Linux.
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
